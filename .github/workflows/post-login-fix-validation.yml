name: Finalize post-login fix formatting

on:
  push:
    branches:
      - fix/post-login-app-loading

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize app.js boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('static/app.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('    throw e;\n  }\n}function confirmDiscardIfDirty', '    throw e;\n  }\n}\n\nfunction confirmDiscardIfDirty', 1)
          if not s.endswith('\n'):
              s += '\n'
          p.write_text(s, encoding='utf-8')
          PY
          node --check static/app.js
      - name: Commit if needed
        run: |
          if git diff --quiet -- static/app.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/app.js
          git commit -m "Normalize startup fix formatting"
          git push
