name: Temporary drawing engine refactor

on:
  push:
    branches:
      - fix/chart-drawing-pointer-controller

permissions:
  contents: write

jobs:
  refactor-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/chart-drawing-pointer-controller
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply drawing engine architecture refactor
        run: python .github/tmp/refactor_drawing_engine.py

      - name: JavaScript syntax checks
        run: |
          node --check static/chart-engine/drawings.js
          node --check static/chart-mobile-interactions.js
          node --check static/chart-editor-polish.js
          node --check static/chart-analysis.js
          node --check static/chart-engine/chart-tile.js
          node --check tests/chart_drawing_runtime.test.js

      - name: Event-level Drawing Engine runtime regressions
        run: node tests/chart_drawing_runtime.test.js

      - name: Install Python test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Full pytest
        run: python -m pytest -q

      - name: Python compileall
        run: python -m compileall -q .

      - name: Diff sanity
        run: |
          git diff --check
          git status --short
          git diff --stat

      - name: Commit tested refactor and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/drawing-engine-refactor.yml .github/tmp/refactor_drawing_engine.py
          git add static/chart-engine/drawings.js \
                  static/chart-mobile-interactions.js \
                  static/chart-editor-polish.js \
                  static/chart-analysis.js \
                  static/chart-engine/chart-tile.js \
                  tests/test_chart_drawing_interactions.py \
                  tests/chart_drawing_runtime.test.js
          git commit -m "Refactor drawing engine pointer state machine"
          git push origin HEAD:fix/chart-drawing-pointer-controller
