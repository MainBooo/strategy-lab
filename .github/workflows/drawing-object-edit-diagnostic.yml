name: Temporary drawing object edit hotfix
on:
  push:
    branches:
      - fix/drawing-object-editing
permissions:
  contents: write
jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/tmp/apply_drawing_object_edit_hotfix.py
      - name: Install test dependencies
        run: python -m pip install -q -r requirements.txt pytest
      - name: Verify
        run: |
          set -euxo pipefail
          node --check static/chart-engine/drawings.js
          node --check static/chart-analysis.js
          node --check static/chart-mobile-interactions.js
          node --check tests/chart_drawing_runtime.test.js
          node tests/chart_drawing_runtime.test.js
          python -m pytest -q
          python -m compileall -q .
          git diff --check
          ! grep -n 'patchHandles\|patchAllManagers' static/chart-mobile-interactions.js
      - name: Commit verified fix
        run: |
          set -euxo pipefail
          rm .github/workflows/drawing-object-edit-diagnostic.yml
          rm .github/tmp/apply_drawing_object_edit_hotfix.py
          git config user.name MainBooo
          git config user.email '92219996+MainBooo@users.noreply.github.com'
          git add -A
          git commit -m 'Fix touch editing and note text controls'
          git push origin HEAD:fix/drawing-object-editing
