name: Temporary drawing init hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-drawing-init.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove stale drawing patch calls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('static/chart-mobile-interactions.js')
          text = path.read_text()
          stale = [
              '      patchHandles(this.drawingMgr);\n',
              '    patchAllManagers(this);\n',
          ]
          before = text
          for needle in stale:
              text = text.replace(needle, '')
          if 'patchHandles(' in text or 'patchAllManagers(' in text:
              raise SystemExit('stale patch call remains')
          if text == before:
              print('No stale calls found; nothing to patch')
          else:
              path.write_text(text)
              print('Removed stale patchHandles/patchAllManagers calls')
          PY

      - name: Verify JavaScript and drawing runtime
        run: |
          node --check static/chart-mobile-interactions.js
          node --check static/chart-engine/drawings.js
          node tests/chart_drawing_runtime.test.js
          python -m compileall -q .
          git diff --check

      - name: Commit hotfix and remove temporary workflow
        run: |
          git config user.name 'MainBooo'
          git config user.email '92219996+MainBooo@users.noreply.github.com'
          git rm -f .github/workflows/hotfix-drawing-init.yml || true
          git add static/chart-mobile-interactions.js
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Fix chart workspace initialization after drawing refactor'
          git push origin HEAD:main
