name: Temporary final drawing regression

on:
  push:
    branches:
      - fix/chart-drawing-pointer-controller

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check static/chart-mobile-interactions.js
          node --check static/chart-editor-polish.js
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install pytest
      - name: Run final drawing regression tests
        run: python -m pytest -q tests/test_chart_drawing_interactions.py
